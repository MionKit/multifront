name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same steps `pnpm devx check` runs locally, split so a failure names its step.
      - name: Format
        run: pnpm devx format --check
      - name: Lint and typecheck
        run: pnpm devx lint
      - name: Agent docs
        run: pnpm devx agent-docs
      # The VS Code build the editor exit test downloads; its version is pinned in that file.
      - &vscode-cache
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/e2e/editor/lib/vscode.ts') }}
      # The browser tests' Chromium, cached per Playwright version (each pins its own browser build).
      - &playwright-version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - &playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - &chromium
        run: pnpm exec playwright install --with-deps chromium
      # Verbose: the log names every test that ran, so a skipped one shows. The consumer job runs the consumer area.
      - name: Test
        run: pnpm devx test --reporter verbose --exclude 'consumer/**'
      - name: Build
        run: pnpm devx build

  # Every test again on the oldest supported React: the bottom of @multifront/vite's react peer ranges.
  react-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rewrites pnpm-workspace.yaml and the lockfile of this throwaway checkout, and prints the installed floor.
      - run: pnpm devx peer-floor react
      - *vscode-cache
      - *playwright-version
      - *playwright-cache
      - *chromium
      # Fresh consumer apps pin their own framework versions: only the consumer job installs them.
      - name: Test
        run: pnpm devx test --reporter verbose --exclude 'consumer/vite-react.spec.ts' --exclude 'consumer/app.spec.ts'

  # Every test again on the oldest supported Vue: the bottom of @multifront/vite's vue peer ranges.
  vue-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rewrites pnpm-workspace.yaml and the lockfile of this throwaway checkout, and prints the installed floor.
      - run: pnpm devx peer-floor vue
      - *vscode-cache
      - *playwright-version
      - *playwright-cache
      - *chromium
      # Fresh consumer apps pin their own framework versions: only the consumer job installs them.
      - name: Test
        run: pnpm devx test --reporter verbose --exclude 'consumer/vite-react.spec.ts' --exclude 'consumer/app.spec.ts'

  # Every test again on the oldest supported Svelte: the bottom of @multifront/vite's svelte peer ranges.
  svelte-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rewrites pnpm-workspace.yaml and the lockfile of this throwaway checkout, and prints the installed floor.
      - run: pnpm devx peer-floor svelte
      - *vscode-cache
      - *playwright-version
      - *playwright-cache
      - *chromium
      # Fresh consumer apps pin their own framework versions: only the consumer job installs them.
      - name: Test
        run: pnpm devx test --reporter verbose --exclude 'consumer/vite-react.spec.ts' --exclude 'consumer/app.spec.ts'

  # Builds the fixture library and packs one tarball per framework, once, for every consumer job.
  consumer-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm devx consumer-pack consumer-tarballs
      - uses: actions/upload-artifact@v7
        with:
          name: consumer-tarballs
          path: consumer-tarballs/
          if-no-files-found: error
          retention-days: 3

  # The consumer area: those tarballs installed into fresh apps outside the workspace, from the npm registry.
  consumer:
    needs: consumer-pack
    runs-on: ubuntu-latest
    env:
      MULTIFRONT_CONSUMER_TARBALLS: ${{ github.workspace }}/consumer-tarballs
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # One pnpm store for the repo and the fresh apps; setup-node's cache would save only the repo's lockfile.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-consumer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/e2e/fixtures/apps/consumer-*/package.json') }}
          restore-keys: pnpm-consumer-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: consumer-tarballs
          path: consumer-tarballs
      - *playwright-version
      - *playwright-cache
      - *chromium
      - name: Test
        run: pnpm devx test --reporter verbose packages/e2e/consumer/

  # Windows-only behaviour: `\` paths turned into `/` (scope ids, devx package dirs, mf-build output lines) and tool launch (devx, mf-build).
  windows:
    runs-on: windows-latest
    steps:
      # Fixtures keep LF on every OS: offsets, lines and columns are pinned on them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each step runs a different tool (oxfmt, oxlint + tsc, vitest) through devx's launcher.
      - run: pnpm devx format --check
      - run: pnpm devx lint
      - name: Test
        run: pnpm devx test --reporter verbose packages/core/test/context.spec.ts packages/core/test/svelte/library.spec.ts packages/e2e/build/library-cli.spec.ts packages/e2e/devx/

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        run: pnpm devx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
