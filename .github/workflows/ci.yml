name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same steps `pnpm devx check` runs locally, split so a failure names its step.
      - name: Format
        run: pnpm devx format --check
      - name: Lint and typecheck
        run: pnpm devx lint
      - name: Agent docs
        run: pnpm devx agent-docs
      # The VS Code build the editor exit test downloads; its version is pinned in that file.
      - uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/e2e/editor/lib/vscode.ts') }}
      # The browser tests' Chromium, cached per Playwright version (each pins its own browser build).
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # Verbose: the log names every test that ran, so a skipped one shows.
      - name: Test
        run: pnpm devx test --reporter verbose
      - name: Build
        run: pnpm devx build

  # Every test again on the oldest supported React: the bottom of @multifront/vite's react peer ranges.
  react-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rewrites pnpm-workspace.yaml and the lockfile of this throwaway checkout, and prints the installed floor.
      - run: pnpm devx peer-floor react
      # The VS Code build the editor exit test downloads; its version is pinned in that file.
      - uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/e2e/editor/lib/vscode.ts') }}
      # The browser tests' Chromium, cached per Playwright version (each pins its own browser build).
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test
        run: pnpm devx test --reporter verbose

  # Windows-only behaviour: `\` paths turned into `/` (scope ids, devx package dirs) and devx tool launch.
  windows:
    runs-on: windows-latest
    steps:
      # Fixtures keep LF on every OS: offsets, lines and columns are pinned on them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each step runs a different tool (oxfmt, oxlint + tsc, vitest) through devx's launcher.
      - run: pnpm devx format --check
      - run: pnpm devx lint
      - name: Test
        run: pnpm devx test --reporter verbose packages/core/test/context.spec.ts packages/e2e/devx/

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        run: pnpm devx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
