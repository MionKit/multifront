name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same steps `pnpm devx check` runs locally, split so a failure names its step.
      - name: Format
        run: pnpm devx format --check
      - name: Lint and typecheck
        run: pnpm devx lint
      - name: Agent docs
        run: pnpm devx agent-docs
      - name: Test
        run: pnpm devx test
      - name: Build
        run: pnpm devx build

  # Windows-only behaviour: `\` paths turned into the `/` paths scope ids hash.
  windows:
    runs-on: windows-latest
    steps:
      # Fixtures keep LF on every OS: offsets, lines and columns are pinned on them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm exec`, not `pnpm devx test`: devx spawns `node_modules/.bin` shims without a shell, which Windows cannot run.
      - name: Test
        run: pnpm exec vitest run --project core --reporter verbose packages/core/test/context.spec.ts

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        run: pnpm devx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
