name: vscode-release

# A published GitHub release v<version.json> packs the extension once, runs the packed-.vsix tests on that file,
# then publishes the same file to the VS Code Marketplace and Open VSX. One-time setup: SETUP.md, "Publishing the extension".
on:
  release:
    types: [published]
  # A dry run on a PR that changes this release path: every step but the two publishes.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/vscode-release.yml
      - packages/e2e/editor/vscode/vsix.spec.ts
      - packages/e2e/editor/lib/vsix.ts

permissions:
  contents: read

# A release is never cancelled mid-publish.
concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      # Both stores take major.minor.patch only: no pre-release suffix. A PR dry run checks all but the tag.
      - name: version.json is major.minor.patch, the release tag v + it
        run: |
          version=$(node -p "require('./version.json').version")
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.json holds $version; the stores take major.minor.patch only"
            exit 1
          fi
          if [ "${{ github.event_name }}" = release ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::release $GITHUB_REF_NAME does not match version.json; tag it v$version"
            exit 1
          fi
          echo "MULTIFRONT_VSIX=${{ github.workspace }}/packages/vscode/multifront-vscode-$version.vsix" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm devx vsix
      # The VS Code build the tests download; same key as ci.yml, so a release reuses its cache.
      - uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/e2e/editor/lib/vscode.ts') }}
      # A crashed VS Code otherwise hangs in the kernel, piping its huge core to systemd-coredump.
      - run: sudo sysctl -w kernel.core_pattern=/dev/null
      # Verbose: the log names every test that ran on the file about to be published.
      - name: Test the packed file
        run: pnpm devx test --reporter verbose packages/e2e/editor/vscode/vsix.spec.ts
      # --skip-duplicate: a re-run after a failed Open VSX publish passes over the version already on the Marketplace.
      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "$MULTIFRONT_VSIX" --skip-duplicate
      - name: Publish to Open VSX
        if: github.event_name == 'release'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish "$MULTIFRONT_VSIX" --skip-duplicate
